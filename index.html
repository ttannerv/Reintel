<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RE:INTEL — CMA Platform</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{ --ink:#26262a; --gold:#b3653f; --gold2:#5c7590; --paper:#f2ede4; --line:#ded7ca; --mut:#9a9a96;
         --sold:#4e7a5c; --active:#5c7590; --expired:#9e9e9e; --green:#4e7a5c; --red:#8f4040; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--paper)}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 70px}
  /* toolbar */
  .toolbar{background:var(--ink);position:sticky;top:0;z-index:200;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .tb-l{display:flex;align-items:center;gap:10px}
  .tb-logo{width:30px;height:30px;background:var(--gold);border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700;font-size:17px}
  .tb-name{color:#fff;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:16px;letter-spacing:.04em}
  .tb-sub{color:rgba(255,255,255,.35);font-size:9px;letter-spacing:.14em}
  .tb-steps{display:flex;gap:6px;align-items:center}
  .tb-step{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.32);font-size:11px;background:none;border:0;font-family:inherit;cursor:default;padding:4px 2px}
  .tb-step b{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.14);color:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:10px}
  .tb-step.active{color:#fff}.tb-step.active b{background:var(--gold);color:#fff}
  .tb-step.done{color:rgba(255,255,255,.85);cursor:pointer}.tb-step.done b{background:var(--gold);color:#fff}
  .tb-arrow{color:rgba(255,255,255,.2);font-size:11px}
  .tb-btn{padding:9px 16px;background:var(--gold);border:0;border-radius:7px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
  .tb-btn:hover{background:#9c5432}
  .tb-btn.ghost{background:rgba(255,255,255,.12);color:#fff}.tb-btn.ghost:hover{background:rgba(255,255,255,.2)}
  .tb-btn:disabled{opacity:.4;cursor:not-allowed}
  /* sample loader */
  .loader{display:flex;gap:8px;align-items:center}
  .loader select{font-family:inherit;font-size:12px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:8px 10px}
  .loader select option{color:#111}
  /* page */
  .page{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.07);overflow:hidden;margin-top:26px}
  .pad{padding:34px 40px}
  .steplab{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .steplab .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px}
  .steplab .t{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:24px;font-weight:600}
  .steplab .d{font-size:12px;color:#aaa;margin-left:auto;letter-spacing:.04em}
  .sub{font-size:13px;color:#8a8a86;margin:0 0 22px 40px}
  .sec-h{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:17px;font-weight:600;margin:24px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  /* MLS bar + form */
  .mls{display:flex;align-items:center;gap:14px;background:#eceff1;border:1px dashed #e3d2ac;border-radius:11px;padding:16px 18px;margin-bottom:22px}
  .mls .ic{width:38px;height:38px;border-radius:9px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .mls .tt{font-size:13.5px;font-weight:700}.mls .dd{font-size:12px;color:#8a7c52}
  .mls .go{margin-left:auto;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .or{text-align:center;color:#bbb;font-size:11px;letter-spacing:.12em;margin:6px 0 18px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px}
  .f{display:flex;flex-direction:column;gap:6px}.f.col2{grid-column:span 2}.f.col3{grid-column:1 / -1}
  .f label{font-size:10px;letter-spacing:.08em;color:#999;text-transform:uppercase;font-weight:600}
  .f input,.f select,.f textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;width:100%;transition:border .15s}
  .f input::placeholder,.f textarea::placeholder{color:#c2c2bd}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gold)}
  .f textarea{resize:vertical;min-height:70px}
  .f.bad input,.f.bad select{border-color:#e3a3a3;background:#fdf6f6}
  /* actions */
  .actions{display:flex;align-items:center;justify-content:space-between;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
  .btn{font-family:inherit;font-weight:700;border-radius:8px;cursor:pointer;border:0}
  .btn-save{background:none;border:1px solid var(--line);color:#777;padding:11px 18px;font-size:13px}
  .btn-save:hover{border-color:#bbb;color:#444}
  .btn-back{background:none;border:1px solid var(--line);color:#777;padding:11px 18px;font-size:13px}
  .btn-next{background:var(--gold);color:#fff;padding:12px 26px;font-size:13px}
  .btn-next:hover{background:#9c5432}
  .btn-next:disabled{opacity:.4;cursor:not-allowed}
  .req{font-size:11.5px;color:#b0b0ab}
  /* facts/grids reused */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .fact{background:#fafaf9;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .fact .k{font-size:9px;letter-spacing:.1em;color:#999;text-transform:uppercase}
  .fact .v{font-size:18px;font-weight:700;margin-top:4px}.fact .v small{font-size:11px;color:#888;font-weight:500}
  .note{background:#eceff1;border:1px solid #ccd6dd;border-radius:9px;padding:11px 14px;font-size:12px;color:#6b5a2e}
  .note b{color:var(--gold)}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{font-size:9px;letter-spacing:.08em;color:#999;text-transform:uppercase;text-align:left;padding:8px 10px;background:#fafaf9;border-bottom:1.5px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid #f3f3f1;vertical-align:middle}
  td.num{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}
  .tag-s{padding:1px 7px;border-radius:9px;font-size:9px;font-weight:700}
  .t-sold{background:#edf3ed;color:var(--sold)}.t-active{background:#e3f0fb;color:var(--active)}.t-pending{background:#f3e9fb;color:#7d6890}.t-expired{background:#f0f0f0;color:#777}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px}
  .b-ok{background:#edf3ed;color:var(--sold)}.b-adj{background:#f7f0e1;color:#8a5a13}
  .ai-card{display:flex;gap:14px;padding:14px 16px;background:#fafaf9;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  .ai-id{width:30px;height:30px;border-radius:8px;flex-shrink:0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .ai-body .ah{font-size:12.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
  .ai-body .at{font-size:12px;color:#555;line-height:1.6}
  .quality{display:flex;align-items:center;gap:16px;background:var(--ink);color:#fff;border-radius:11px;padding:16px 20px;margin-top:6px;flex-wrap:wrap}
  .quality .scorebig{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:30px;font-weight:700;color:var(--gold2)}
  .quality .qd{font-size:11px;color:rgba(255,255,255,.6)}
  .quality .qstats{margin-left:auto;display:flex;gap:22px;text-align:right;flex-wrap:wrap}
  .quality .qstats .v{font-size:17px;font-weight:700}.quality .qstats .k{font-size:9px;color:rgba(255,255,255,.45);letter-spacing:.1em}
  #map{height:380px;width:100%;border-radius:8px;overflow:hidden}
  .legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 2px;font-size:11px;color:#444}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .toggle{display:inline-flex;background:#f1efea;border-radius:9px;padding:3px;gap:2px}
  .toggle button{background:transparent;border:0;color:#666;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .statstrip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:14px}
  .statstrip .s{padding:14px 8px;border-right:1px solid var(--line)}.statstrip .s:last-child{border-right:0}
  .statstrip .k{font-size:9px;letter-spacing:.1em;color:#999;text-transform:uppercase}
  .statstrip .v{font-size:20px;font-weight:700;margin-top:3px}.statstrip .v small{font-size:11px;color:#888;font-weight:500}
  .scen{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .scen .c{border:1px solid var(--line);border-radius:11px;padding:16px;text-align:center}
  .scen .c.rec{border-color:var(--gold);background:#eceff1;box-shadow:0 2px 12px rgba(179,101,63,.12)}
  .scen .lab{font-size:10px;letter-spacing:.08em;color:#999;text-transform:uppercase}
  .scen .pr{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:22px;font-weight:700;margin:6px 0}
  .scen .meta{font-size:11px;color:#666;line-height:1.7}
  .scen .recbadge{display:inline-block;margin-top:8px;font-size:9px;font-weight:700;color:var(--gold);letter-spacing:.06em}
  .timeline{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--line)}
  .tl{position:relative;padding:0 0 16px 6px}
  .tl::before{content:"";position:absolute;left:-29px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--gold)}
  .tl .tt{font-size:13px;font-weight:700}.tl .td{font-size:11.5px;color:#666}.tl .tw{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.04em}
  .check{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
  .check div{display:flex;gap:9px;font-size:12px;color:#444;align-items:flex-start}
  .check i{width:16px;height:16px;border:1.5px solid var(--gold);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:10px;font-weight:700}
  /* add-comp row */
  .compadd{display:grid;grid-template-columns:2fr repeat(6,1fr) auto;gap:8px;align-items:end;background:#fafaf9;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
  .compadd .f label{font-size:8.5px}.compadd .f input,.compadd .f select{padding:8px 9px;font-size:12px}
  .compadd .addbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 12px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;height:37px}
  .delx{background:none;border:0;color:#8f4040;cursor:pointer;font-size:15px;font-weight:700}
  .emptynote{text-align:center;color:#b6b6b0;font-size:12px;padding:20px;border:1px dashed var(--line);border-radius:10px;margin-top:10px}
  /* value hero */
  .vhero{background:var(--ink);color:#fff;border-radius:12px;padding:24px;display:flex;flex-direction:column;justify-content:center}
  .vhero .big{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:42px;font-weight:700;color:var(--gold2);line-height:1.1}
  .pill{padding:4px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.04em;display:inline-block}
  .pill-h{background:rgba(46,125,50,.18);border:1px solid rgba(46,125,50,.4);color:#9ae6a4}
  .pill-m{background:rgba(179,101,63,.18);border:1px solid rgba(179,101,63,.4);color:#e0c071}
  .pill-l{background:rgba(153,27,27,.18);border:1px solid rgba(153,27,27,.4);color:#f0a8a8}
  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:500;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .chk{color:var(--gold2);margin-right:7px}
  .hide{display:none!important}
  .foot{display:flex;justify-content:space-between;font-size:10px;color:#cfcfc9;margin-top:24px}
  /* pull bar */
  .pullbar{display:flex;gap:8px;margin-bottom:8px}
  .pullbar input{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .pullbar input:focus{outline:none;border-color:var(--gold)}
  .pullbar button{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  /* agent branded cover on Step 4 */
  .brandcover{display:flex;align-items:center;gap:16px;background:var(--ink);color:#fff;border-radius:12px;padding:18px 22px;margin-bottom:18px}
  .brandcover.empty{justify-content:space-between;background:#eceff1;color:#6b5a2e;border:1px dashed #e3d2ac;font-size:13px}
  .brandcover .avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;font-family:Georgia,'Iowan Old Style','Times New Roman',serif}
  .bc-id{flex:1}.bc-nm{font-size:16px;font-weight:700}.bc-br{font-size:12px;color:rgba(255,255,255,.6)}.bc-ct{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px}.bc-tag{font-size:11px;color:var(--gold2);font-style:italic;margin-top:6px}
  .bc-r{text-align:right}.bc-prep{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.1em}.bc-date{font-size:12px;color:var(--gold2);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  .bc-edit{margin-top:8px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:7px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
  /* what-if pricing simulator */
  .whatif{background:#eceff1;border:1px solid #ccd6dd;border-radius:12px;padding:18px 20px;margin:18px 0 4px}
  .wi-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;gap:12px}
  .wi-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#3a5fb0;font-weight:700}
  .wi-sub{font-size:11px;color:#6b86c0}
  .wi-price{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:32px;font-weight:700;color:var(--ink);line-height:1}
  .whatif input[type=range]{width:100%;accent-color:var(--gold);margin:6px 0 14px;cursor:pointer}
  .wi-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .wi-stats>div{text-align:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 8px}
  .wi-v{font-size:18px;font-weight:700}.wi-l{font-size:9.5px;color:#999;margin-top:3px;letter-spacing:.03em}
  /* property photos */
  .scorepill{display:inline-block;min-width:26px;color:#fff;font-weight:700;font-size:11px;padding:2px 7px;border-radius:9px;text-align:center}
  .thumb{width:50px;height:36px;border-radius:6px;object-fit:cover;background:#eef1f4;display:block}
  .aithumb{width:58px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#eef1f4}
  .subjphoto{width:100%;height:210px;object-fit:cover;border-radius:12px;margin-bottom:16px;background:#eef1f4;display:block}
  .subjphoto-wrap{position:relative}
  .subjphoto-tag{position:absolute;left:12px;bottom:26px;background:rgba(13,13,13,.7);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:7px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}
  .gallery figure{margin:0}
  .gallery img{width:100%;height:80px;object-fit:cover;border-radius:8px;background:#eef1f4}
  .gallery figcaption{font-size:9.5px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* visual pricing (Focus1st-style) */
  .vp3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .vpc{background:#fafaf9;border:1px solid var(--line);border-radius:11px;padding:16px;text-align:center}
  .vpc.hot{background:#eceff1;border-color:var(--gold)}
  .vpk{font-size:11px;color:#888;font-weight:600}
  .vpv{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:30px;font-weight:700;color:var(--gold);margin:6px 0;line-height:1}
  .vpd{font-size:10.5px;color:#999;line-height:1.5}
  .vpcap{font-size:12px;color:#777;margin:16px 0 6px}
  /* modal */
  .modalbg{position:fixed;inset:0;background:rgba(13,13,13,.55);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px}
  .modalbox{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
  .modalbox h3{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:22px;font-weight:600}
  .modalbox .msub{font-size:12.5px;color:#888;margin:2px 0 18px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mgrid .f.col2{grid-column:1 / -1}
  .mnote{font-size:11px;color:#3a5fb0;background:#eceff1;border:1px solid #ccd6dd;border-radius:8px;padding:9px 11px;margin-top:14px}
  .mact{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  /* My CMAs library */
  .lwrap{max-height:50vh;overflow:auto;margin-top:4px}
  .lrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .lrow:last-child{border-bottom:0}
  .li{flex:1;min-width:0}.ln{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lm{font-size:11px;color:#8a8f96;margin-top:2px}
  .lp{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:4px}
  .lp-done{background:#edf3ed;color:#4e7a5c}.lp-draft{background:#f7f0e1;color:#8a5a13}
  .lv{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap}
  .lbtn{background:var(--ink);color:#fff;border:0;border-radius:7px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .lx{background:none;border:0;color:#8f4040;font-size:17px;font-weight:700;cursor:pointer;line-height:1}
  #printAll{display:none}
  #printMap{display:none;width:100%;border-radius:10px;border:1px solid var(--line)}
  @media print{
    @page{size:letter portrait;margin:.5in}
    html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .toolbar,#toast,.modalbg,.foot{display:none!important}
    .wrap{max-width:none;padding:0}.page{box-shadow:none;border-radius:0;margin:0}
    #panel{display:none!important}
    #printAll{display:block!important}
    .printpage{page-break-after:always}
    .printpage:last-child{page-break-after:auto}
    .actions,.btn,.tb-btn,.mls,.compadd,.or,.emptynote,.go,#csvBtn,.req,button{display:none!important}
    input[type=range]{display:none!important}
    input,select,textarea{border:0!important;background:transparent!important;padding:0!important;color:var(--ink)!important;-webkit-appearance:none;appearance:none;resize:none;font-family:inherit}
    .f label{color:#999}
    #map,.leaflet-container{display:none!important}
    #printMap{display:block!important}
    canvas{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

function resolveSubjectPhoto(){
  if(ST.S&&ST.S.photoManual) return;
  const k=gkey(); const a=(ST.S.address||"").trim(); if(!k||!a) return;
  const city=(ST.S.city||"").trim(), st=(ST.S.state||"").trim(); const hasCS=!!(city&&st);

    .then(r=>r.json()).then(function(j){

      const ambiguous = !ok ? true : (res.length>1 || res[0].partial_match===true || (res[0].geometry&&res[0].geometry.location_type==="APPROXIMATE"));

const ADJ_BY_STATE={ AZ:{sqft:95,halfBath:6000,bed:9000,garage:12000,condition:9000}, _def:{sqft:60,halfBath:5000,bed:8000,garage:11000,condition:7000} };
function adjFor(state){return ADJ_BY_STATE[state]||ADJ_BY_STATE._def;}
/* Editable, per-CMA adjustment rates: the agent's own dials.
   The $/sqft rate auto-calibrates to THIS comp set (0.6 × median time-adjusted $/sqft, clamped $25–400) —
   backtested: cut median error ~27% vs a flat rate. State table is the fallback; agent edits always win. */
function defaultRates(){ const d=adjFor(ST.S.state);
  return {sqft:(ST._calibSqft||d.sqft),halfBath:d.halfBath,bed:d.bed,garage:d.garage,condition:d.condition}; }
function currentRates(){ const base=defaultRates(); return ST.rates?Object.assign(base,ST.rates):base; }
function ratesAreCustom(){ if(!ST.rates)return false; const d=defaultRates(); return ["sqft","halfBath","bed","garage","condition"].some(k=>ST.rates[k]!=null&&+ST.rates[k]!==+d[k]); }
/* Time adjustment: correct an older sale to today using annual appreciation (default a conservative 3%/yr, capped ±25%/yr). */
/* Per-state annual appreciation (median $/sqft YoY) — sourced from the daily public market
   layer (Realtor.com · Zillow · FHFA). Used to correct older sales to today's market.
   Several markets are NEGATIVE — a flat national rate would misprice them. Agent-editable below. */
const APPR_BY_STATE={"UT":0.0034,"MT":0.0179,"HI":0.0207,"VA":0.0098,"MO":0.0133,"TN":-0.0467,"IN":0.0315,"ME":-0.0031,"KS":0.0429,"MI":0.0234,"AZ":-0.0196,"DC":-0.0192,"RI":0.162,"NV":-0.0237,"NY":-0.011,"CT":-0.0426,"MD":-0.0179,"PA":-0.003,"MA":-0.0057,"AR":0.045,"ID":0.0124,"AL":0.0038,"TX":-0.0252,"NM":0.0019,"NJ":0.0079,"SC":-0.0063,"OH":0.0231,"ND":0.0469,"KY":0.0172,"FL":-0.044,"DE":-0.0142,"WI":0.0053,"MN":-0.0015,"CO":-0.0243,"CA":-0.0144,"VT":-0.0048,"GA":-0.0023,"MS":0.0257,"WY":0.0263,"WV":-0.0066,"NH":0.0138,"NE":-0.0006,"LA":-0.0042,"WA":-0.0249,"IA":0.0112,"OR":-0.0204,"AK":0.033,"NC":-0.0147,"IL":-0.0128,"OK":-0.0027,"SD":-0.007};
const APPR_ASOF="2026-05";
/* Effective rate: agent override > state data > flat national fallback. */
function apprRate(){ if(ST.apprPct!=null&&!isNaN(ST.apprPct)) return ST.apprPct/100;
  const s=(ST.S.state||"").toUpperCase(); return APPR_BY_STATE[s]!=null?APPR_BY_STATE[s]:0.03; }
function apprIsState(){ return ST.apprPct==null && APPR_BY_STATE[(ST.S.state||"").toUpperCase()]!=null; }
const APPR_YOY=0.03;
function _monthsAgo(dateStr){ const t=Date.parse(dateStr||""); if(isNaN(t))return null; return Math.max(0,(Date.now()-t)/(86400000*30.44)); }
function timeAdjFor(c){ if(!c.salePrice||!c.closeDate)return 0; const m=_monthsAgo(c.closeDate); if(m==null||m<0.5)return 0;
  const a=Math.max(-0.25,Math.min(0.25,apprRate())); return Math.round(c.salePrice*a*(m/12)); }
function destDB(lat,lng,mi,deg){const R=3958.8,d=mi/R,br=deg*Math.PI/180,la1=lat*Math.PI/180,lo1=lng*Math.PI/180;
  const la2=Math.asin(Math.sin(la1)*Math.cos(d)+Math.cos(la1)*Math.sin(d)*Math.cos(br));
  const lo2=lo1+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(la1),Math.cos(d)-Math.sin(la1)*Math.sin(la2));
  return[la2*180/Math.PI,lo2*180/Math.PI];}
function prep(S,comps){
  // pass 1: time-adjust each sale to today, then calibrate the $/sqft rate from THIS comp set
  comps.forEach((c,i)=>{ if(c.id==null)c.id=comps.reduce((m,x)=>Math.max(m,x.id||0),0)+1;
    if(c.lat==null&&S.lat!=null&&c.distance!=null){const[a,o]=destDB(S.lat,S.lng,c.distance,c.bearing!=null?c.bearing:(i*47)%360);c.lat=a;c.lng=o;}
    c.timeAdj=timeAdjFor(c);
    c.basis=c.salePrice?Math.round(c.salePrice+c.timeAdj):null;   // price corrected to today's market
    c.price=c.basis||c.listPrice; c.ppsf=(c.sqft>0&&c.price>0)?Math.round(c.price/c.sqft):0;
  });
  const ppsfs=comps.filter(c=>c.status==="sold"&&c.salePrice>0&&c.sqft>0).map(c=>c.ppsf).filter(p=>p>0).sort((a,b)=>a-b);
  ST._calibSqft=ppsfs.length>=2?Math.max(25,Math.min(400,Math.round(0.6*ppsfs[Math.floor(ppsfs.length/2)]))):null;
  // pass 2: feature adjustments on the time-adjusted basis, using the (calibrated or agent-set) rates
  const adj=currentRates(); S._adj=adj;
  comps.forEach(c=>{
    if(c.salePrice){
      const sz=(S.sqft>0&&c.sqft>0)?(S.sqft-c.sqft)*adj.sqft:0;
      const bdiff=(S.baths!=null&&c.baths!=null)?((S.baths||0)-(c.baths||0)):0;
      const ba=Math.sign(bdiff)*Math.round(Math.abs(bdiff)/0.5)*adj.halfBath;
      const bd=(S.beds!=null&&c.beds!=null)?((S.beds||0)-(c.beds||0))*adj.bed:0;
      const ga=(S.garage!=null&&c.garage!=null)?((S.garage||0)-(c.garage||0))*adj.garage:0;
      const co=c.condition==="Superior"?-adj.condition:(c.condition==="Inferior"?adj.condition:0);
      c.adjParts={sizeAdj:sz,bathAdj:ba,bedAdj:bd,garAdj:ga,condAdj:co,timeAdj:c.timeAdj||0};

function score(S,c){ // 0..100 similarity for weighting
  let s=100; const gap=(S.sqft>0&&c.sqft>0)?Math.abs(S.sqft-c.sqft)/S.sqft:0.3;

  if(S.baths!=null&&c.baths!=null)s-=Math.abs(Math.round(((S.baths||0)-(c.baths||0))/0.5))*5;

function valuation(S,comps){
  const allSold=comps.filter(c=>c.status==="sold");
  const solds=allSold.filter(c=>c.usable);            // only comps with a real price, sqft, and positive adjusted value
  const excluded=allSold.length-solds.length;         // messy comps we refused to average in
  if(solds.length<2)return null;
  // weight = similarity × recency decay (182-day half-life; undated sales get a neutral 0.5 — backtested)
  solds.forEach(c=>{const m=c.closeDate?_monthsAgo(c.closeDate):null;
    const rw=(m==null)?0.5:Math.max(0.05,Math.pow(0.5,m/6));
    c._w=score(S,c)*rw;});
  const wsum=solds.reduce((a,c)=>a+c._w,0);
  const indicated=Math.round(solds.reduce((a,c)=>a+c.adjusted*c._w,0)/wsum);
  const vals=solds.map(c=>c.adjusted), lo=Math.min(...vals), hi=Math.max(...vals);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const cv=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length)/mean;
  let label="High",pill="pill-h"; if(solds.length<3||cv>0.06){label="Medium";pill="pill-m";} if(solds.length<2||cv>0.12){label="Low";pill="pill-l";}
  const ppsfVals=solds.filter(c=>c.ppsf>0).map(c=>c.ppsf);
  const avgPpsf=ppsfVals.length?Math.round(ppsfVals.reduce((a,b)=>a+b,0)/ppsfVals.length):0;
  const domVals=solds.filter(c=>c.dom>0).map(c=>c.dom);
  const avgDom=domVals.length?Math.round(domVals.reduce((a,b)=>a+b,0)/domVals.length):0;
  return {indicated,low:Math.round(lo),high:Math.round(hi),cv,label,pill,n:solds.length,excluded,avgPpsf,avgDom,
          recLow:Math.round(indicated*0.975/1000)*1000, rec:Math.round(indicated/1000)*1000, recHigh:Math.round(indicated*1.025/1000)*1000};
}

function step1ok(){return ST.S.address&&ST.S.beds>0&&ST.S.baths>0&&ST.S.sqft>0;}
function step2ok(){return ST.comps.filter(c=>c.status==="sold"&&c.salePrice>0).length>=2;}
function canReach(n){ if(n<=1)return true; if(n===2)return step1ok(); if(n>=3)return step1ok()&&step2ok(); }

function appStaticMap(){
  const k=gkey(), S=ST.S; if(!k||!S||S.lat==null) return null;
  let m="markers=color:0xb3653f%7Clabel:S%7C"+S.lat+","+S.lng, groups={};
  (ST.comps||[]).forEach(c=>{ if(c.lat==null||c.lng==null) return;
    const col=({sold:"0x4e7a5c",active:"0x5c7590",pending:"0x7d6890",expired:"0x9e9e9e"})[c.status]||"0x777777";
    (groups[col]=groups[col]||[]).push(c.lat+","+c.lng); });
  const parts=Object.keys(groups).map(col=>"markers=size:small%7Ccolor:"+col+"%7C"+groups[col].join("%7C"));
  return "https://maps.googleapis.com/maps/api/staticmap?size=640x360&scale=2&maptype=roadmap&"+m+(parts.length?"&"+parts.join("&"):"")+"&key="+k;

     <button class="addbtn" id="addCompBtn">Add</button>
   </div>
   <div style="font-size:11px;color:#aaa;margin-top:6px">Sold price for closed comps; list price for active/expired. DOM &amp; garage optional.</div>`;
  return `<div class="steplab"><div class="n">2</div><div class="t">Comparable Sales</div><div class="d">${solds.length} SOLD · ${others.filter(c=>c.status==='pending').length} PENDING · ${others.filter(c=>c.status==='active').length} ACTIVE · ${others.filter(c=>c.status==='expired').length} EXPIRED</div></div>
  <div class="sub">Closed comps drive the valuation; active &amp; expired show the live competition and price ceiling.</div>
  <div class="sec-h">Sold comparables — appraiser-style adjustments</div>${soldRows}
  ${(ST.val&&ST.val.excluded>0)?`<div class="note" style="margin-top:12px;background:#f7f0e1;border-color:#e3d2ac;color:#8a5a13"><b>${ST.val.excluded} sold comp${ST.val.excluded>1?"s":""} left out of the valuation</b> — missing a sale price or square footage (or an invalid adjusted value). Add the missing figures so they count toward the number.</div>`:""}
  ${solds.length?ratesPanelHTML():""}

  <div class="actions">
   <button class="btn btn-back" id="backBtn">← Subject</button>

  const _temp=v.avgDom?(v.avgDom<=20?"Seller's market":v.avgDom<=45?"Balanced":"Buyer-leaning"):"—";

    <div class="qstats"><div><div class="v">${v.avgDom||"—"} days</div><div class="k">AVG DOM</div></div><div><div class="v">${l2s}</div><div class="k">LIST-TO-SALE</div></div><div><div class="v">${absorp}</div><div class="k">ABSORPTION</div></div><div><div class="v">$${v.avgPpsf}</div><div class="k">AVG $/SQFT</div></div></div></div>

   <div class="fact"><div class="k">${ST.meta?(ST.S.state||"State")+" baseline":"Market read · as of "+_asOf}</div><div class="v" style="font-size:14px">${mState}</div><div style="font-size:11px;color:#777;margin-top:6px">${mStateSub}</div></div></div>

/* ---- STEP 4 ---- */
function _domAt(p,rec){ const r=p/rec; const base=(ST.val&&ST.val.avgDom>0)?ST.val.avgDom:40; return Math.max(2,Math.round(base*Math.exp(4*(r-1)))); }
function _oddsAt(p,rec){ const r=p/rec; return Math.max(3,Math.min(99,Math.round(80-400*(r-1)))); }
function answerCMA(q){
  q=(q||"").toLowerCase().trim();
  const v=ST.val||{}, S=ST.S||{};
  const solds=(ST.comps||[]).filter(c=>c.status==="sold");
  const rec=v.rec, recHigh=v.recHigh, recLow=v.recLow;
  if(!rec) return "Finish Steps 1–3 first, then I can answer from the comps.";
  if(!q) return "Ask me anything about this valuation — price, timing, a specific comp, net proceeds…";
  const domR=_domAt(rec,rec), oddsR=_oddsAt(rec,rec);
  const has=(...ws)=>ws.some(w=>q.includes(w));
  const compMatch=solds.find(c=>{ const tok=shortAddr(c.address).toLowerCase().split(/\s+/).filter(t=>t.length>2&&!/^\d+$/.test(t)); return tok.some(t=>q.includes(t)); });
  if(has("zillow","zestimate","redfin","online","estimate","website","app say")) return `Automated estimates never walk the home or adjust for condition and exact comps. This number is built from <b>${v.n} closed sales</b> adjusted to your home — landing near <b>${money(v.indicated)}</b> at <b>$${v.avgPpsf}/sqft</b>. That’s what buyers actually paid for homes like yours.`;
  if(compMatch) return `${shortAddr(compMatch.address)} closed at <b>${money(compMatch.salePrice)}</b>, but adjusted to your home for size, baths and condition it supports <b>${money(compMatch.adjusted)}</b> — in line with the <b>${money(rec)}</b> recommendation. We adjust it the same way the appraiser will.`;
  if(has("higher","stretch","list high","price high","come down","overpr","push","try for") || /list (it )?(at|for)/.test(q) || /\b(6|7|5|8|9)\d{2}[,]?\d{3}\b/.test(q.replace(/\s/g,""))){
    const m=q.replace(/[,$ ]/g,"").match(/(\d{5,7})/); const p=m?parseInt(m[1]):Math.round(recHigh*1.05/1000)*1000;
    const dom=_domAt(p,rec), odds=_oddsAt(p,rec), pct=Math.round((p/rec-1)*100);
    return `At <b>${money(p)}</b> (${pct>0?"+":""}${pct}% vs the recommendation) the model predicts <b>~${dom} days</b> to an offer and about <b>${odds}%</b> odds — versus <b>~${domR} days</b> and <b>${oddsR}%</b> at ${money(rec)}. Overpriced homes sit, go stale, and usually sell for less than if priced right on day one.`;
  }
  if(has("low","renovat","remodel","upgrade","put money","invest","spent","why so")) return `Your upgrades are already credited in the adjustment grid — better-condition comps adjust down to your number, dated ones adjust up. Buyers pay for the result, not the receipts. At <b>${money(rec)}</b> the home draws the most competition, and that’s what lifts the final price.`;
  if(has("how long","days","dom","fast","quick","sell","odds","chance","time to","when will")) return `The closed comps averaged <b>${v.avgDom} days</b> on market. At <b>${money(rec)}</b> the model puts you near <b>~${domR} days</b> with about <b>${oddsR}%</b> odds of selling inside the active window.`;
  if(has("wait","spring","later","next year","hold off","better market","market improve")) return `You’re pricing against <i>today’s</i> closed sales. Waiting trades a known market for an unknown one — and more inventory means more competition, not less. A sharp price now, while these comps are fresh, is the cleanest path to the top of the range.`;
  if(has("net","proceeds","walk away","take home","make","after fee","after commission","payoff","pocket")){
    const cc=closingCosts(rec), pt=cc.pt;
    return `At <b>${money(rec)}</b>, after commission, closing costs${pt.credit?` and a ${money(pt.credit)} prorated-tax ${pt.dir}`:""}${closeCfg().payoff?" and your loan payoff":""}, estimated net proceeds are about <b>${money(cc.net)}</b>. See the net sheet for the line-by-line breakdown — title/escrow confirms exact figures at closing.`;
  }
  if(has("price","worth","value","how much","recommend","list")) return `Recommended list price is <b>${money(rec)}</b>, supported range <b>${money(recLow)}–${money(recHigh)}</b>. It centers on <b>${v.n}</b> closed comps adjusted to your home (~${money(v.indicated)}), at <b>${v.label}</b> confidence.`;
  return `Quick read: recommended <b>${money(rec)}</b> (range ${money(recLow)}–${money(recHigh)}), about <b>~${domR} days</b> to sell at ~<b>${oddsR}%</b> odds, from <b>${v.n}</b> adjusted comps. Try asking about a specific comp, listing higher, what you’d net, or how long it’ll take.`;
}
function initAsk(){
  const inp=$("ask_in"), btn=$("ask_btn"), out=$("ask_out");
  if(!btn||!inp||!out) return;
  const go=q=>{ out.innerHTML=answerCMA(q); };
  btn.onclick=()=>go(inp.value);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(inp.value); } });
  document.querySelectorAll(".askchip").forEach(b=>b.onclick=()=>{ inp.value=b.dataset.q; go(b.dataset.q); });
}

function _esc(x){return String(x==null?"":x).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}
function chatAnswer(q){
  const t=(q||"").toLowerCase().trim();
  if(!t) return "Ask me anything about this property — price, how long to sell, a specific comp, or what you’d net.";
  if(/^(hi|hey|hello|yo|sup|howdy|good (morning|afternoon|evening))\b/.test(t)) return "Hey! I’m RE:INTEL. Ask me anything about this CMA — the price, how fast it’ll sell, a specific comp, or your net proceeds.";
  if(/(thank|thx|appreciate|cheers|great|perfect|awesome|nice)/.test(t)) return "Anytime. Want to check anything else — the price, a comp, or your net at closing?";
  if(/(who are you|what are you|what can you|^help|how do you work|what do you do|how does this)/.test(t)) return "I answer questions about this CMA using the actual comps you loaded. Try: “why not list higher?”, “how long to sell?”, “what about [a comp address]?”, or “what will I net?”.";
  return answerCMA(q);
}
let CHAT=[];
function chatRender(){ const b=$("chatBody"); if(!b)return;
  b.innerHTML=CHAT.map(m=>m.role==="u"
    ? `<div style="text-align:right;margin:9px 0"><span style="display:inline-block;background:var(--gold);color:#fff;padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:13px;max-width:82%;text-align:left">${_esc(m.text)}</span></div>`
    : `<div style="margin:9px 0"><span style="display:inline-block;background:#eef1f6;color:#1c2433;padding:9px 13px;border-radius:14px 14px 14px 4px;font-size:13px;line-height:1.6;max-width:88%">${m.text}</span></div>`
  ).join(""); b.scrollTop=b.scrollHeight; }
function chatPush(q){ q=(q||"").trim(); if(!q)return; CHAT.push({role:"u",text:q}); chatRender();
  setTimeout(()=>{ CHAT.push({role:"a",text:chatAnswer(q)}); chatRender(); },220); }
function initChat(){ const fab=$("chatFab"),win=$("chatWin"),inp=$("chatIn"),snd=$("chatSend"),cl=$("chatClose"); if(!fab||!win)return;
  const open=()=>{ win.style.display="flex"; fab.style.display="none"; if(!CHAT.length){CHAT.push({role:"a",text:"Hi! I’m RE:INTEL. Ask me anything about this CMA — price, timing, a specific comp, or your net proceeds."}); chatRender();} setTimeout(()=>inp&&inp.focus(),60); };
  const close=()=>{ win.style.display="none"; fab.style.display="inline-flex"; };
  fab.onclick=open; if(cl)cl.onclick=close;
  if(snd)snd.onclick=()=>{ chatPush(inp.value); inp.value=""; };
  if(inp)inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault(); chatPush(inp.value); inp.value="";} });
  document.querySelectorAll(".chatchip").forEach(c=>c.onclick=()=>chatPush(c.dataset.q));
}

function objectionSim(v,S,solds){
  if(!solds||!solds.length) return "";
  const rec=v.rec, recHigh=v.recHigh;
  const stretch=Math.round(recHigh*1.05/1000)*1000;
  const domR=_domAt(rec,rec), oddsR=_oddsAt(rec,rec);
  const domS=_domAt(stretch,rec), oddsS=_oddsAt(stretch,rec);
  const pctUp=Math.max(1,Math.round((stretch/rec-1)*100));
  const top=solds.slice().sort((a,b)=>(b.salePrice||0)-(a.salePrice||0))[0];
  const topHigher = top && (top.salePrice||0) > rec;
  const objs=[
    ["“Zillow (or another site) says it’s worth more than that.”",
     `Those are automated estimates — they never walk the home or adjust for its condition and exact comps. This number is built from <b>${v.n} actual closed sales</b> adjusted line-by-line to your home; they land around <b>${money(v.indicated)}</b> and averaged <b>$${v.avgPpsf}/sqft</b>. That’s what buyers just paid for homes like yours — not a guess from a model that has never seen it.`],
    topHigher?[`“But ${shortAddr(top.address)} sold for ${money(top.salePrice)} — why am I priced lower?”`,
     `Great comp to bring up. It closed at <b>${money(top.salePrice)}</b>, but once you adjust it to your home for the differences in size, baths and condition, it supports <b>${money(top.adjusted)}</b> — right in line with the recommendation. We’re not ignoring it; we’re adjusting it the same way the appraiser will.`]:null,
    [`“Let’s list at ${money(stretch)} and come down if we have to.”`,
     `At <b>${money(stretch)}</b> you’d be about <b>${pctUp}%</b> over where comparable homes are actually closing. The model puts that at roughly <b>~${domS} days</b> to an offer and about <b>${oddsS}%</b> odds — versus <b>~${domR} days</b> and <b>${oddsR}%</b> at ${money(rec)}. Overpriced listings sit, go stale, and on average sell for <i>less</i> than if they’d been priced right on day one. Your first two weeks are the leverage — don’t spend them testing a number the comps don’t support.`],
    [`“I put a lot of money into this house — why so low?”`,
     `Your upgrades are already credited — in the adjustment grid, homes in better condition than yours adjust <i>down</i> to your number and more dated ones adjust <i>up</i>. Buyers pay for the result, not the receipts. At <b>${money(rec)}</b> the home is positioned to pull the most buyers, and competition is what actually drives the final price up.`],
    [`“How do I even know it’ll sell?”`,
     `The closed comps averaged about <b>${v.avgDom} days</b> on market. Priced at <b>${money(rec)}</b>, the model puts you near <b>~${domR} days</b> with roughly <b>${oddsR}%</b> odds of selling inside the active window. Pricing into the band where homes are <i>actually closing</i> — not where they’re listed — is what gets it sold.`],
    [`“Can’t we just wait for a better market?”`,
     `Maybe — but we’re pricing against <i>today’s</i> closed sales, and waiting trades a known market for an unknown one. If more inventory comes on, your home competes with more listings, not fewer. The cleanest path to the top of the range is a sharp price now, while these comps are still fresh.`]
  ].filter(Boolean);
  const cards=objs.map(o=>`<details style="border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff"><summary style="cursor:pointer;padding:13px 15px;font-weight:700;font-size:14px;color:var(--ink);list-style:none">${o[0]}</summary><div style="padding:0 15px 14px;font-size:13px;line-height:1.65;color:#444;border-top:1px solid var(--line)"><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);font-weight:700;margin:11px 0 6px">The data answer</div>${o[1]}</div></details>`).join("");

  ${cards}`;
}

function commRate(){ return (ST.commission!=null?ST.commission:5.5)/100; }
function closeRate(){ return (ST.closing!=null?ST.closing:1)/100; }

/* ===== Seller closing-cost + tax-proration engine ===== */
function defClosingDate(){ const d=new Date(); d.setDate(d.getDate()+45); return d.toISOString().slice(0,10); }
function closeCfg(){
  const yr=new Date().getFullYear();
  const base={ closingDate:defClosingDate(), annualTax:"", taxBasis:365, taxConvention:"arrears", paidThrough:yr+"-01-01",
    titlePct:0.45, transferPct:0.10, escrow:950, recording:150, attorney:0, warranty:550, concessions:0, hoaProration:0,
    payoff:(ST.meta&&ST.meta.payoff)||0, perDiem:0 };
  return Object.assign(base, ST.close||{});
}
function daysActual(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/86400000); }
function days30360(a,b){ const d1=new Date(a),d2=new Date(b); let D1=Math.min(d1.getUTCDate(),30),D2=d2.getUTCDate(); if(D1===30&&D2===31)D2=30;
  return (d2.getUTCFullYear()-d1.getUTCFullYear())*360+(d2.getUTCMonth()-d1.getUTCMonth())*30+(D2-D1); }
function prorateTax(cfg){
  const annual=parseFloat(cfg.annualTax)||0; if(!annual||!cfg.closingDate||!cfg.paidThrough) return {credit:0,days:0,daily:0,dir:"",sign:-1};
  const basis=(+cfg.taxBasis===360)?360:365;
  const daily=annual/basis;
  if(cfg.taxConvention==="advance"){ // seller prepaid through paidThrough → buyer reimburses for the unused days after closing
    const days=Math.max(0,(basis===360?days30360(cfg.closingDate,cfg.paidThrough):daysActual(cfg.closingDate,cfg.paidThrough)));
    return {credit:Math.round(daily*days), days, daily, dir:"reimbursed to seller", sign:+1};
  }
  // arrears (most states): taxes from paidThrough → closing are owed by seller, credited to buyer at closing
  const days=Math.max(0,(basis===360?days30360(cfg.paidThrough,cfg.closingDate):daysActual(cfg.paidThrough,cfg.closingDate)));
  return {credit:Math.round(daily*days), days, daily, dir:"credit to buyer", sign:-1};
}
function closingCosts(price,cfg){
  cfg=cfg||closeCfg(); const items=[];
  const N=k=>parseFloat(cfg[k])||0;
  items.push(["Commission ("+(+(commRate()*100).toFixed(2))+"%)", price*commRate(), -1]);
  const title=price*N("titlePct")/100; if(title)items.push(["Title / owner's policy ("+(+N("titlePct").toFixed(2))+"%)", title, -1]);
  const transfer=price*N("transferPct")/100; if(transfer)items.push(["Transfer / excise tax ("+(+N("transferPct").toFixed(2))+"%)", transfer, -1]);
  if(N("escrow"))items.push(["Escrow / settlement fee", N("escrow"), -1]);
  if(N("recording"))items.push(["Recording & doc fees", N("recording"), -1]);
  if(N("attorney"))items.push(["Attorney fee", N("attorney"), -1]);
  if(N("warranty"))items.push(["Home warranty", N("warranty"), -1]);
  if(N("concessions"))items.push(["Seller concessions", N("concessions"), -1]);
  const pt=prorateTax(cfg); if(pt.credit)items.push(["Prorated property tax — "+pt.dir+" ("+pt.days+" days)", pt.credit, pt.sign]);
  if(N("hoaProration"))items.push(["HOA dues proration", N("hoaProration"), -1]);
  if(N("payoff"))items.push(["Loan payoff", N("payoff"), -1]);
  if(N("perDiem"))items.push(["Per-diem interest", N("perDiem"), -1]);
  const net=Math.round(price + items.reduce((a,it)=>a+it[2]*it[1],0));
  return {items,net,pt};
}
function setClose(k,v){ ST.close=ST.close||{}; ST.close[k]=v;
  if(k==="taxConvention"&&v==="advance"){ const cd=closeCfg().closingDate; if(!ST.close.paidThrough||Date.parse(ST.close.paidThrough)<=Date.parse(cd)){ ST.close.paidThrough=(new Date(cd).getUTCFullYear())+"-12-31"; } }
  render(); }
function step4HTML(){

    ? `Prorated tax: <b>$${pt.daily.toFixed(2)}/day × ${pt.days} days = ${money(pt.credit)}</b> ${pt.dir} ${cfg.taxConvention==='arrears'?'(arrears — lowers seller proceeds)':'(advance — added to seller proceeds)'}.`
    : `Enter the annual property tax (and dates) to compute the proration automatically.`;

  const closePanel=`<div style="background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px">

      ${ST.S.state&&/^[A-Za-z]{2}$/.test(ST.S.state)?`<a href="https://publicrecords.netronline.com/state/${ST.S.state.toUpperCase()}" target="_blank" rel="noopener" style="font-weight:700;font-size:11.5px;color:#9c5432;text-decoration:none">Find the annual tax on the county record ↗</a>`:""}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
      ${cin('Closing date','closingDate','date')}

  const scenHTML=scen.map(s=>`<div class="c${s[5]?' rec':''}"><div class="lab">${s[0]}</div><div class="pr">${money(s[1])}</div><div class="meta">${s[2]}<br>Offer odds: ${s[3]}</div><div style="font-size:10.5px;color:#888;margin-top:8px;line-height:1.5">${s[4]}</div>${s[5]?'<div class="recbadge">★ RECOMMENDED</div>':''}</div>`).join("");

function initMap(){

function marketSegment(rec){ const nBands=7,lo=rec*0.86,hi=rec*1.18,step=(hi-lo)/(nBands-1),bands=[];
  for(let i=0;i<nBands;i++){ const price=lo+i*step,r=price/rec;
    const sold=Math.max(0,Math.round(15*Math.exp(-Math.pow((r-0.96)/0.07,2))));
    const active=Math.max(1,Math.round(2+Math.max(0,(r-0.93))*55));
    const pending=Math.max(0,Math.round(7*Math.exp(-Math.pow((r-0.99)/0.06,2))));
    const expired=r>1.04?Math.round((r-1.04)*45):0;
    bands.push({price:Math.round(price),sold,pending,active,expired}); }
  return {bands,lo,step}; }
const SEASON_US=[0.5,0.6,0.85,1.0,1.25,1.3,1.15,1.0,0.95,0.85,0.65,0.5];
const SEASON_SUN=[0.7,0.9,1.2,1.3,1.25,1.0,0.8,0.78,0.9,1.0,0.85,0.7];   // AZ/FL/NV/TX — earlier peak (heat)
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function seasonData(state){ const mult=["AZ","FL","NV","TX"].includes(state)?SEASON_SUN:SEASON_US;
  const counts=mult.map(m=>Math.round(m*12));
  const peak=[...counts.keys()].sort((a,b)=>counts[b]-counts[a]).slice(0,3).sort((a,b)=>a-b).map(i=>MON[i]);
  return {counts,peak}; }
// What-if pricing: drag the list price, watch DOM / odds / net move (uses the
// comp-set behavior — higher price => longer DOM, lower odds).
function initWhatIf(){ const v=ST.val; const sl=$("wi_slider"); if(!v||!sl)return;
  const rec=v.rec, baseDom=v.avgDom||30, payoff=ST.meta?ST.meta.payoff:0;
  const min=Math.round(rec*0.90/1000)*1000, max=Math.round(rec*1.12/1000)*1000;
  sl.min=min; sl.max=max; sl.step=1000; sl.value=rec;
  function upd(price){ const r=price/rec;
    const dom=Math.max(2,Math.min(240,Math.round(baseDom*Math.exp(4*(r-1)))));
    const odds=Math.max(3,Math.min(99,Math.round(80-400*(r-1))));
    const net=closingCosts(price).net;
    const diff=price-rec, pct=Math.round(diff/rec*1000)/10;
    $("wi_price").textContent=money(price);
    $("wi_price").style.color = price>v.recHigh?"#8f4040":(price<v.recLow?"#4e7a5c":"var(--ink)");
    $("wi_dom").textContent="~"+dom+" days";
    $("wi_odds").textContent=odds+"%";
    $("wi_net").textContent=money(net);
    $("wi_pos").innerHTML = diff===0 ? '<span style="color:#888">at rec</span>'
      : (diff>0?'<span style="color:#8f4040">+'+money(diff)+'</span>':'<span style="color:#4e7a5c">'+money(diff)+'</span>')
        +' <small style="color:#aaa">('+(pct>0?'+':'')+pct+'%)</small>';
  }
  sl.oninput=e=>upd(+e.target.value); upd(rec);
}

const PPSF={AZ:270,IA:183,CA:470,TX:200,FL:256,NY:430,WA:349,CO:286,_def:225};
const CENTER={AZ:[33.3528,-111.789],IA:[41.6611,-91.5302],CA:[34.0522,-118.2437],TX:[30.2672,-97.7431],FL:[27.9944,-82.4451],NY:[40.7128,-74.006],WA:[47.6062,-122.3321],CO:[39.7392,-104.9903],_def:[39.5,-98.35]};
const STREETS=["Mesquite","Saguaro","Camelback","Hayden","Ironwood","Willow","Sycamore","Juniper","Prairie","Meadowlark","Birch","Sundance","Granite","Sonora","Acacia","Oakcrest","Dover","Bristol","Foster","Teton"];
function parseAddr(a){ const parts=a.split(",").map(s=>s.trim()); const street=parts[0]||""; let city="",state="";
  if(parts.length>=3){ city=parts[1]; const m=parts[2].match(/[A-Za-z]{2}/); state=m?m[0].toUpperCase():""; }
  else if(parts.length===2){ const m=parts[1].match(/([A-Za-z .]+?)\s+([A-Za-z]{2})\b/); if(m){city=m[1].trim();state=m[2].toUpperCase();} else city=parts[1]; }
  return {street,city,state}; }
function genAddr(j){ return (1000+Math.floor(Math.random()*8000))+" "+STREETS[(j*7+Math.floor(Math.random()*STREETS.length))%STREETS.length]+" "+(Math.random()<0.5?"Dr":"Ave"); }
function genComps(S,state){ const base=PPSF[state]||PPSF._def; const rnd=(a,b)=>a+Math.random()*(b-a);
  const plan=["sold","sold","sold","sold","sold","pending","active","active","expired"]; const out=[];
  plan.forEach((st,j)=>{ const sqft=Math.round(S.sqft+rnd(-220,220)); const ppsf=base*rnd(0.94,1.06); const price=Math.round(sqft*ppsf/500)*500;
    const beds=Math.max(2,S.beds+(Math.random()<0.3?(Math.random()<0.5?-1:1):0));
    const baths=Math.max(1.5,S.baths+(Math.random()<0.3?(Math.random()<0.5?-0.5:0.5):0));
    const c={address:genAddr(j),status:st,distance:+rnd(0.3,1.6).toFixed(1),bearing:Math.round(rnd(0,359)),beds,baths,sqft,garage:S.garage,dom:Math.round(rnd(6,70)),condition:"Similar"};
    if(st==="sold"){ c.salePrice=price; c.listPrice=Math.round(price*rnd(1.0,1.03)/500)*500; }
    else c.listPrice=Math.round(price*(st==="expired"?rnd(1.06,1.12):rnd(1.0,1.04))/500)*500;
    out.push(c); });
  return out;
}

function parseCSV(text){

  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inq){ if(c=='"'){ if(text[i+1]=='"'){field+='"';i++;} else inq=false; } else field+=c; }
    else { if(c=='"')inq=true; else if(c==','){row.push(field);field="";} else if(c=="\n"){row.push(field);rows.push(row);row=[];field="";} else field+=c; } }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
const CSV_ALIASES={
  address:["address","streetaddress","fulladdress","propertyaddress","unparsedaddress","street","addressline1"],
  city:["city"], state:["state","stateorprovince"], zip:["zip","zipcode","postalcode"],
  status:["status","mlsstatus","standardstatus","saletype","listingstatus"],
  beds:["beds","bedrooms","br","bedroomstotal","totalbedrooms"],
  baths:["baths","bathrooms","ba","bathroomstotalinteger","totalbaths","bathroomstotal"],
  bathsFull:["bathroomsfull","fullbaths","fullbathrooms","bathsfull"],
  bathsHalf:["bathroomshalf","halfbaths","halfbathrooms","bathshalf"],
  stnum:["streetnumber","stnumber","housenumber"], stdir:["streetdirprefix","streetdirection"],
  stname:["streetname"], stsuffix:["streetsuffix","streettype"],
  sqft:["sqft","squarefeet","livingarea","gla","abovegradefinishedarea","sqfttotal","livingareasqft","approxsqft"],
  listPrice:["listprice","currentprice","originallistprice","lp","listingprice"],
  salePrice:["soldprice","closeprice","saleprice","sp","closingprice"],
  closeDate:["closedate","closingdate","solddate","datesold","dateclosed","closedon","soldon","settlementdate","coedate","saledate","closed"],
  dom:["dom","daysonmarket","cdom","cumulativedaysonmarket"],
  year:["yearbuilt","year"], garage:["garagespaces","garage","garagestalls"],
  lat:["latitude","lat"], lng:["longitude","lng","long","lon"],
  photo:["photo","photourl","photourls","primaryphoto","primaryphotourl","photolink","picture","imageurl","image","mediaurl"]
};
function _csvnorm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function mapHeaders(headers){ const idx={}; headers.forEach((h,i)=>{ const n=_csvnorm(h);
  for(const key in CSV_ALIASES){ if(CSV_ALIASES[key].includes(n)&&idx[key]==null) idx[key]=i; } }); return idx; }
function findHeaderRow(rows){ let best=0,bestn=-1,lim=Math.min(rows.length,6); for(let i=0;i<lim;i++){ const n=Object.keys(mapHeaders(rows[i])).length; if(n>bestn){bestn=n;best=i;} } return best; }
function _csvnum(v){ const s=String(v==null?"":v).trim(); const m=s.match(/([\d,]*\.?\d+)\s*([kKmM])\b/);
  let n=parseFloat(s.replace(/[^0-9.\-]/g,""));
  if(m){ n=parseFloat(m[1].replace(/,/g,""))*(/[kK]/.test(m[2])?1e3:1e6); }
  return isFinite(n)?n:null; }
const CSV_STATUS={closed:"sold",closedsale:"sold",sold:"sold",s:"sold",solds:"sold",active:"active",a:"active",act:"active",comingsoon:"active",backonmarket:"active",activebackonmarket:"active",new:"active",pending:"pending",p:"pending",pnd:"pending",undercontract:"pending",activeundercontract:"pending",contingent:"pending",ctg:"pending",expired:"expired",exp:"expired",cancelled:"expired",canceled:"expired",withdrawn:"expired",tempoffmarket:"expired",x:"expired"};
function csvStatus(v){ return CSV_STATUS[_csvnorm(v)]||"active"; }
function _hav(a,o,b,p){ const R=3958.8,dl=(b-a)*Math.PI/180,dn=(p-o)*Math.PI/180,la1=a*Math.PI/180,la2=b*Math.PI/180;
  const x=Math.sin(dl/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dn/2)**2; return R*2*Math.asin(Math.sqrt(x)); }
function importMlsCsv(file){
  const reader=new FileReader();
  reader.onload=function(e){ try{
    const rows=parseCSV(e.target.result).filter(r=>r.some(c=>String(c).trim()!==""));
    if(rows.length<2){ toast("That file looks empty."); return; }
    const hr=findHeaderRow(rows); const idx=mapHeaders(rows[hr]);
    if(idx.address==null && idx.stname==null && idx.sqft==null){ toast("Couldn't find MLS columns — is this an MLS export?"); return; }
    const comps=[];
    for(let r=hr+1;r<rows.length;r++){ const row=rows[r]; const g=k=>idx[k]!=null?row[idx[k]]:undefined;
      const sqft=_csvnum(g("sqft")), lp=_csvnum(g("listPrice")), sp=_csvnum(g("salePrice"));
      if(!sqft && !lp && !sp) continue;
      let baths=_csvnum(g("baths"));
      if(baths==null){ const fb=_csvnum(g("bathsFull")), hb=_csvnum(g("bathsHalf")); if(fb!=null||hb!=null) baths=(fb||0)+(hb||0)*0.5; }
      let addr=(g("address")||"").trim();
      if(!addr){ addr=[g("stnum"),g("stdir"),g("stname"),g("stsuffix")].map(x=>String(x||"").trim()).filter(Boolean).join(" ").trim(); }
      const c={ id:comps.length+1, address:addr, city:(g("city")||"").trim(), state:(g("state")||"").trim(),
        status:csvStatus(g("status")), beds:_csvnum(g("beds")), baths:baths, sqft:(sqft||null),
        listPrice:lp||null, salePrice:sp||null, dom:_csvnum(g("dom")), year:_csvnum(g("year"))||null,
        closeDate:(function(){const t=Date.parse(String(g("closeDate")||"").trim());return isNaN(t)?null:new Date(t).toISOString().slice(0,10);})(),
        garage:_csvnum(g("garage")), lat:_csvnum(g("lat")), lng:_csvnum(g("lng")), photo:(g("photo")||"").trim()||null, condition:"Similar" };
      if(c.status!=="sold") c.salePrice=null;
      if(c.salePrice!=null && c.salePrice<1000) c.salePrice=null;   // reject nonsense sold prices (e.g. a mis-parsed cell)
      comps.push(c);
    }
    if(!comps.length){ toast("No usable rows found in that file."); return; }
    if(ST.S&&ST.S.lat!=null){ comps.forEach(c=>{ if(c.lat!=null&&c.lng!=null) c.distance=Math.round(_hav(ST.S.lat,ST.S.lng,c.lat,c.lng)*10)/10; }); }
    ST.comps=comps; ST.narrative=null; ST.mls={connected:true,name:"CSV import"}; recompute();
    ST.step=2; ST.reached=Math.max(ST.reached,2); render();
    toast(comps.length+" comps imported — review them in Step 2.");
  }catch(err){ toast("Couldn't read that CSV."); } };
  reader.readAsText(file);
}
function pullFromMls(addrInputId,opts){ opts=opts||{};
  const addr=($(addrInputId)&&$(addrInputId).value.trim())||ST.S.address;
  if(!addr){ toast("Enter an address to pull."); return; }
  const p=parseAddr(addr); const state=p.state||ST.S.state||"";
  const center=CENTER[state]||CENTER._def;
  ST.S.address=addr; if(p.city)ST.S.city=p.city; if(state)ST.S.state=state;
  ST.S.lat=center[0]+(Math.random()-0.5)*0.02; ST.S.lng=center[1]+(Math.random()-0.5)*0.02;
  setSubjectPhotoAuto();
  if(opts.fillSubject){ if(!ST.S.sqft)ST.S.sqft=2050; if(!ST.S.beds)ST.S.beds=4; if(!ST.S.baths)ST.S.baths=2.5;
    if(!ST.S.garage)ST.S.garage=2; if(!ST.S.year)ST.S.year=2015; if(!ST.S.style)ST.S.style="Single-Level"; if(!ST.S.condition)ST.S.condition="Average"; }
  const sqft=ST.S.sqft||2050, beds=ST.S.beds||4, baths=ST.S.baths||2.5, garage=ST.S.garage||2;
  ST.comps=genComps({sqft,beds,baths,garage},state);
  recompute(); render();
  toast("Pulled "+ST.comps.length+" listings from "+ST.mls.name+(opts.fillSubject?" · subject + comps populated":" · comps populated"));
}

/* ============================================================= MY CMAs ==== */
// Saved + in-progress CMAs, stored on this device. In the cloud app these live
// in Postgres against the agent's account (status = draft | finalized).
const CMA_KEY="reintel_cmas_v1";
function loadLibrary(){ try{ return JSON.parse(localStorage.getItem(CMA_KEY)||"[]"); }catch(e){ return ST._lib; } }
function saveLibrary(a){ ST._lib=a; try{ localStorage.setItem(CMA_KEY, JSON.stringify(a)); }catch(e){} }
function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function saveCurrent(status){
  if(!ST.S.address && !(ST.comps && ST.comps.length)){ toast("Add a subject or comps before saving."); return; }
  const lib=loadLibrary();
  const rec={ id: ST.cmaId||uid(), name: ST.S.address||"Untitled CMA", city: ST.S.city||"", state: ST.S.state||"",
    status: status||"draft", step: ST.step, value: (ST.val&&ST.val.rec)||null, confidence:(ST.val&&ST.val.label)||null,
    savedAt: new Date().toISOString(), S: ST.S, comps: ST.comps, agent: ST.agent, mls: ST.mls, rates: ST.rates, apprPct: ST.apprPct,
    close: (ST.close||{payoff:closeCfg().payoff}), commission: ST.commission, narrative: ST.narrative, customized: !!ST.customized };
  const i=lib.findIndex(x=>x.id===rec.id);
  if(i>=0) lib[i]=rec; else lib.unshift(rec);
  saveLibrary(lib); ST.cmaId=rec.id;
  toast(status==="complete"?"Saved to My CMAs — complete.":"Draft saved to My CMAs."); render();
}
function openCma(id){
  const rec=loadLibrary().find(x=>x.id===id); if(!rec)return;
  ST.mode="saved"; ST.meta=null; ST.cmaId=rec.id;
  ST.S=rec.S||{state:""}; ST.comps=rec.comps||[]; if(rec.agent)ST.agent=rec.agent; if(rec.mls)ST.mls=rec.mls; ST.rates=rec.rates||null; ST.close=rec.close||null; ST.apprPct=(rec.apprPct!=null?rec.apprPct:null);
  ST.commission=(rec.commission!=null?rec.commission:null); ST.narrative=(rec.narrative!=null?rec.narrative:null); ST.customized=!!rec.customized;
  recompute();
  ST.reached = (step1ok()&&step2ok())?4:(step1ok()?2:1);
  ST.step = Math.min(rec.step||1, ST.reached);
  closeModal(); render(); toast("Opened — "+(rec.name||"CMA"));
}
function deleteCmaRec(id){ saveLibrary(loadLibrary().filter(x=>x.id!==id)); if(ST.cmaId===id)ST.cmaId=null; libModal(); }
function libModal(){
  const lib=loadLibrary();
  const rows = lib.length ? lib.map(r=>{
    const dt=new Date(r.savedAt).toLocaleDateString("en-US",{month:"short",day:"numeric"});
    const pill = r.status==="complete" ? '<span class="lp lp-done">Complete</span>' : '<span class="lp lp-draft">Draft · step '+(r.step||1)+'</span>';
    const where=[r.city,r.state].filter(Boolean).join(", ");
    return `<div class="lrow"><div class="li"><div class="ln">${r.name}</div><div class="lm">${where?where+" · ":""}${dt} ${pill}</div></div>
      <div class="lv">${r.value?money(r.value):"—"}</div>
      <button class="lbtn" data-open="${r.id}">Resume</button><button class="lx" data-delc="${r.id}" title="Delete">×</button></div>`;
  }).join("") : '<div class="emptynote" style="margin-top:6px">No saved CMAs yet. Build one and hit <b>Save</b>.</div>';
  openModal(`<h3>My CMAs</h3><p class="msub">Your saved and in-progress analyses. Resume a draft or reopen a completed one.</p>
    <div class="lwrap">${rows}</div>
    <div class="mact"><button class="btn btn-save" id="lib_close">Close</button>${ST.S.address||ST.comps.length?'<button class="btn btn-next" id="lib_save">Save current</button>':''}</div>`);
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCma(b.dataset.open));
  document.querySelectorAll("[data-delc]").forEach(b=>b.onclick=()=>deleteCmaRec(b.dataset.delc));
  $("lib_close").onclick=closeModal;
  const ls=$("lib_save"); if(ls)ls.onclick=()=>{ saveCurrent(ST.step>=4?"complete":"draft"); libModal(); };
}

/* ============================================================= WIRING ===== */
function wire(){
  // step 1 inputs
  document.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("input",()=>{ let val=el.value;
      if(["beds","baths","sqft","year","garage"].includes(el.dataset.k)) val=val===""?"":parseFloat(val);
      ST.S[el.dataset.k]=val;
      const nb=$("nextBtn"); if(nb){nb.disabled=!step1ok();} const rq=$("req"); if(rq)rq.textContent=step1ok()?"":"Address, beds, baths & sq ft required";
    });
    if(["address","city","state"].includes(el.dataset.k)){ el.addEventListener("change",resolveSubjectPhoto); }
  });
  const spu=$("s_photo_url"); if(spu)spu.onchange=()=>{ const v=spu.value.trim(); if(v){ST.S.photo=v;ST.S.photoManual=true;ST.S._photoHint=null;} else {ST.S.photoManual=false;ST.S.photo=null;resolveSubjectPhoto();} render(); };
  const spf=$("s_photo_file"); if(spf)spf.onchange=ev=>{ const f=ev.target.files&&ev.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=x=>{ST.S.photo=x.target.result;ST.S.photoManual=true;ST.S._photoHint=null;render();}; rd.readAsDataURL(f); };
  const spc=$("s_photo_clear"); if(spc)spc.onclick=()=>{ST.S.photoManual=false;ST.S.photo=null;resolveSubjectPhoto();render();};
  // MLS connect / pull (Step 1 + Step 2)
  ["mlsBtn","mlsBtn2"].forEach(id=>{const b=$(id);if(b)b.onclick=mlsModal;});
  const pb1=$("pullBtn"); if(pb1)pb1.onclick=()=>pullFromMls("pullAddr",{fillSubject:true});
  const pb2=$("pullBtn2"); if(pb2)pb2.onclick=()=>pullFromMls("pullAddr2",{fillSubject:false});
  const cf=$("csvFile"); if(cf)cf.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) importMlsCsv(f); };
  // branding
  const bb1=$("brandBtn"); if(bb1)bb1.onclick=brandingModal;
  const bb2=$("brandBtn2"); if(bb2)bb2.onclick=brandingModal;
  const sb=$("saveBtn"); if(sb)sb.onclick=()=>saveCurrent("draft");
  const stb=$("saveTopBtn"); if(stb)stb.onclick=()=>saveCurrent(ST.step>=4?"complete":"draft");
  const lb=$("libBtn"); if(lb)lb.onclick=libModal;
  const scb=$("saveCompleteBtn"); if(scb)scb.onclick=()=>saveCurrent("complete");
  // nav
  const nb=$("nextBtn"); if(nb)nb.onclick=()=>{ const target=ST.step+1; if(!canReach(target)){toast(ST.step===1?"Complete the subject first.":"Add at least 2 sold comps.");return;} ST.step=target; ST.reached=Math.max(ST.reached,target); render(); };
  const bb=$("backBtn"); if(bb)bb.onclick=()=>{ST.step=Math.max(1,ST.step-1);render();};
  const p2=$("printBtn2"); if(p2)p2.onclick=()=>printFullCma();
  // rail
  document.querySelectorAll(".tb-step").forEach(b=>b.onclick=()=>{const s=+b.dataset.step; if(canReach(s)&&ST.reached>=s){ST.step=s;render();}});
  // add comp
  const ac=$("addCompBtn"); if(ac)ac.onclick=()=>{
    const g=id=>$(id).value; const status=g("ca_status"); const price=parseFloat(g("ca_price"))||null;
    const num=x=>{const n=parseFloat(x);return isFinite(n)?n:null;};
    const c={address:g("ca_addr")||"(no address)",status,distance:num(g("ca_dist")),beds:num(g("ca_beds")),baths:num(g("ca_baths")),sqft:num(g("ca_sqft"))||0,garage:null,dom:null,photo:(g("ca_photo")||"").trim()||null,condition:"Similar"};
    if(status==="sold")c.salePrice=price; else c.listPrice=price;
    if(!c.sqft||!price){toast("Comp needs at least sq ft and a price.");return;}
    ST.comps.push(c); render(); toast("Comp added.");
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ST.comps=ST.comps.filter(c=>c.id!=b.dataset.del);render();toast("Comp removed.");});
  // editable adjustment rates
  document.querySelectorAll("[data-rate]").forEach(el=>el.addEventListener("change",()=>{
    const k=el.dataset.rate, v=parseFloat(el.value); if(isNaN(v)||v<0){render();return;}
    ST.rates=Object.assign({},currentRates()); ST.rates[k]=v; ST.customized=true; render();
  }));
  const rr=$("rateReset"); if(rr)rr.onclick=()=>{ ST.rates=null; render(); toast("Rates reset to market defaults."); };
  // per-comp condition
  document.querySelectorAll("[data-cond]").forEach(el=>el.addEventListener("change",()=>{
    const c=ST.comps.find(x=>x.id==el.dataset.cond); if(c){ c.condition=el.value; ST.customized=true; render(); }
  }));
  // per-comp adjusted override
  document.querySelectorAll("[data-ovr]").forEach(el=>el.addEventListener("change",()=>{
    const c=ST.comps.find(x=>x.id==el.dataset.ovr); if(!c)return;
    const v=parseFloat(el.value); c.adjOverride=(isNaN(v)||v<=0)?null:v; ST.customized=true; render();
  }));
  document.querySelectorAll("[data-ovrx]").forEach(el=>el.onclick=()=>{
    const c=ST.comps.find(x=>x.id==el.dataset.ovrx); if(c){ c.adjOverride=null; render(); }
  });
  // print top
  $("printBtn").onclick=()=>printFullCma();
}
$("sampleSel").onchange=e=>loadMode(e.target.value);

/* boot */
loadMode("blank");
initChat();
